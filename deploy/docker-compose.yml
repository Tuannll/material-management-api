services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: material-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-YourStrong@Passw0rd!}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" 2>/dev/null ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" 2>/dev/null ||
        exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app-net

  api:
    image: ${IMAGE_NAME:-material-management-api}:${IMAGE_TAG:-latest}
    container_name: material-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-MaterialDb};User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd!};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False;"
    networks:
      - app-net

volumes:
  sqlserver_data:
    driver: local

networks:
  app-net:
    driver: bridge
